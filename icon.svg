<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0b3350"/>
      <stop offset="70%" stop-color="#03111f"/>
      <stop offset="100%" stop-color="#010810"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6fbff"/>
      <stop offset="35%" stop-color="#6fe2ff"/>
      <stop offset="100%" stop-color="#0aa6e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#3fd5ff" stroke-opacity="0.35" stroke-width="4"/>
  <g filter="url(#glow)" fill="none">
    <circle cx="256" cy="256" r="178" stroke="#3fd5ff" stroke-width="6" stroke-dasharray="70 22 12 22" stroke-opacity="0.85"/>
    <circle cx="256" cy="256" r="146" stroke="#ffc94d" stroke-width="12" stroke-dasharray="120 340" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="146" stroke="#ffc94d" stroke-width="12" stroke-dasharray="120 340" stroke-dashoffset="-230" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="112" stroke="#3fd5ff" stroke-width="10" stroke-dasharray="8 12"/>
  </g>
  <!-- korf (bovenaanzicht) -->
  <circle cx="256" cy="256" r="74" fill="url(#core)" opacity="0.55"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#ffc94d" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#e6fbff" filter="url(#glow)"/>
</svg>
