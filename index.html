<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src https://kfqvzbhujqxwegrgvulu.supabase.co; base-uri 'none'; form-action 'none'" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#02060c" />
    <meta property="og:title" content="KIOS 4 · Vakken" />
    <meta property="og:description" content="De volgende wedstrijd en de vakken van KIOS 4" />
    <meta property="og:type" content="website" />
    <title>KIOS 4 · Vakken</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div class="eyebrow">J.A.R.V.I.S. · Vakken</div>
        <h1>KIOS 4</h1>
      </header>

      <section id="match" class="panel match" hidden>
        <div class="eyebrow">Volgende wedstrijd</div>
        <div id="match-opponent" class="opponent"></div>
        <div id="match-when" class="when"></div>
        <div id="match-departure" class="departure" hidden></div>
      </section>

      <section id="notice" class="panel notice" role="status"></section>
      <button id="retry" class="retry" type="button" hidden>Opnieuw proberen</button>

      <section id="lineup" hidden>
        <div class="pitch">
          <svg viewBox="-12 -12 224 424" aria-hidden="true">
            <rect class="tint-attack" x="0" y="0" width="200" height="200" />
            <rect class="tint-defense" x="0" y="200" width="200" height="200" />
            <rect class="free-zone" x="-8" y="-8" width="216" height="416" />
            <g class="lines">
              <rect x="0" y="0" width="200" height="400" />
              <line x1="0" y1="200" x2="200" y2="200" />
              <path d="M 75 66.7 A 25 25 0 0 1 125 66.7 L 125 91.7 A 25 25 0 0 1 75 91.7 Z" />
              <circle cx="100" cy="91.7" r="25" />
              <path d="M 125 333.3 A 25 25 0 0 1 75 333.3 L 75 308.3 A 25 25 0 0 1 125 308.3 Z" />
              <circle cx="100" cy="308.3" r="25" />
            </g>
            <g class="korf">
              <circle cx="100" cy="66.7" r="5.2" />
              <circle class="korf-dot" cx="100" cy="66.7" r="1.6" />
              <circle cx="100" cy="333.3" r="5.2" />
              <circle class="korf-dot" cx="100" cy="333.3" r="1.6" />
            </g>
            <text class="vak-name" x="100" y="189">AANVAL</text>
            <text class="vak-name" x="100" y="217">VERDEDIGING</text>
          </svg>
          <div id="slots"></div>
        </div>

        <div class="panel bench">
          <div class="eyebrow">Bank</div>
          <div id="bench" class="bench-list"></div>
        </div>
        <div id="subs-panel" class="panel" hidden>
          <div class="eyebrow">Wissels · eruit → erin</div>
          <div id="subs" class="sub-list"></div>
        </div>
        <p id="stamp" class="stamp"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
